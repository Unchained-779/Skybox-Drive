version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: skybox-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: skybox-drive
    volumes:
      - mongo_data:/data/db
    networks:
      - skybox-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skybox-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/skybox-drive
      JWT_SECRET: skybox_ultra_secret_jwt_key_2026_super_secure
      JWT_EXPIRES_IN: 7d
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage_data
      DEFAULT_USER_QUOTA: 104857600
      CORS_ORIGIN: "*"
    volumes:
      - server_storage:/app/storage_data
      - server_temp:/app/storage_temp
    depends_on:
      - mongodb
    networks:
      - skybox-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skybox-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - skybox-network

volumes:
  mongo_data:
  server_storage:
  server_temp:

networks:
  skybox-network:
    driver: bridge
