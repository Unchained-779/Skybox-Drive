services:
  - type: web
    name: skybox-drive
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./server/storage_data
      - key: GOOGLE_CLIENT_ID
        value: 547814438680-q5ovo59fntrb2apk8f0v73l0ic3d7mmm.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 547814438680-q5ovo59fntrb2apk8f0v73l0ic3d7mmm.apps.googleusercontent.com
